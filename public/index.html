<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Опрос студентов</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="offlineBanner" class="offline-banner" style="display:none;">
        <span>⚠️ Нет соединения с интернетом</span>
    </div>

    <div class="theme-toggle">
        <button id="themeBtn" aria-label="Переключить тему">
            <img id="themeIcon" src="img/sun.png" alt="Переключить тему" />
        </button>
    </div>

    <div class="container">
        <header>
            <h1>🗳️ Когда начинать урок?</h1>
            <p class="subheader">Выберите удобное время для занятий</p>
        </header>

        <!-- Блок входа -->
        <div id="loginBlock" class="login-block card">
            <div class="login-form">
                <h2>👋 Введите ваше имя</h2>
                <input type="text" id="nameInput" placeholder="Только буквы, 4–12 символов" maxlength="12" autocomplete="off" />
                <div id="nameError" class="error-msg"></div>
                <button id="loginBtn" disabled>Войти и голосовать</button>
            </div>
        </div>

        <!-- Блок голосования -->
        <div id="voteBlock" class="vote-block card" style="display:none;">
            <div class="user-info">
                <span id="userNameDisplay"></span>
                <span class="user-status" id="userStatus">⏳ Ожидание голоса</span>
            </div>
            <div class="vote-options">
                <h3>📅 Выберите интервал</h3>
                <div class="options-grid">
                    <button class="option-btn" data-choice="10-12">10:00 – 12:00</button>
                    <button class="option-btn" data-choice="12-14">12:00 – 14:00</button>
                    <button class="option-btn" data-choice="14-16">14:00 – 16:00</button>
                    <button class="option-btn" data-choice="16-18">16:00 – 18:00</button>
                    <button class="option-btn" data-choice="18-20">18:00 – 20:00</button>
                </div>
                <div id="voteMessage" class="vote-message"></div>
            </div>
        </div>

        <!-- Статистика -->
        <div id="statsBlock" class="stats-block card">
            <h3>📊 Статистика голосования</h3>
            <div id="statsContent">
                <div class="stats-loading">Загрузка...</div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>Softclub</p>
    </footer>

    <!-- Модальное окно подтверждения -->
    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <h3>❗ Подтверждение</h3>
            <p>Вы точно хотите проголосовать за <strong id="confirmChoiceDisplay"></strong>?<br />
            <span style="font-size:0.9em;color:var(--text-secondary);">⚠️ Право изменить голос не будет!</span></p>
            <div class="modal-buttons">
                <button id="modalConfirm" class="modal-btn confirm-btn">Да, голосую</button>
                <button id="modalCancel" class="modal-btn cancel-btn">Отмена</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
